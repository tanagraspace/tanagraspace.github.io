<!doctype html>
<!-- Source for assets/img/og-card.png. Render with _tools/og_card.sh. HERO_SVG and MARK_SVG are filled in by the script. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Nunito+Sans:opsz,wght@6..12,300..800&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #161616; }
  .card { position: relative; width: 1200px; height: 630px; isolation: isolate; font-family: "Nunito Sans", sans-serif; }
  .ts-orbit { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
  .ts-orbit__packet, .ts-orbit__pulse { display: none; }
  .card::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(22,22,22,.95) 0%, rgba(22,22,22,.7) 42%, rgba(22,22,22,0) 70%); }
  .copy { position: absolute; left: 88px; top: 50%; transform: translateY(-54%); }
  .brand { display: flex; align-items: center; gap: 26px; }
  .brand svg { width: 58px; height: auto; }
  .brand h1 { margin: 0; color: #fff; font-weight: 300; font-size: 84px; letter-spacing: .005em; line-height: 1; }
  .tag { margin: 34px 0 0; color: #d9d4ca; font-size: 34px; font-weight: 400; line-height: 1.3; max-width: 640px; }
  .url { position: absolute; left: 88px; bottom: 56px; font-family: "IBM Plex Mono", monospace; font-weight: 500;
    font-size: 20px; letter-spacing: .12em; color: #ffcb24; text-transform: uppercase; }
</style></head>
<body><div class="card">
  HERO_SVG
  <div class="copy">
    <div class="brand">MARK_SVG<h1>Tanagra Space</h1></div>
    <p class="tag">Launching artificial intelligence into orbit.</p>
  </div>
  <div class="url">tanagraspace.com</div>
</div></body></html>
