<form
  class="ts-contact"
  action="https://formspree.io/f/mrgodzqw"
  method="POST"
>
{% if include.subject %}  <input type="hidden" name="_subject" value="{{ include.subject }}" />
{% endif %}  <div class="form-group">
    <label for="contactEmail">Your email:</label>
    <input type="email" name="email" id="contactEmail" required />
  </div>
  <div class="form-group">
    <label for="contactMessage">Your message:</label>
    <textarea name="message" id="contactMessage" class="form-control" rows="5" required></textarea>
  </div>
  <div align="center">
    <button type="submit" class="btn btn--primary">Send</button>
  </div>
</form>
