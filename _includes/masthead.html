<header class="ts-header">
  <div class="ts-header__inner">
    <a class="ts-brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/brand/mark-yellow.svg' | relative_url }}" alt="" width="22" height="31">
      <span>Tanagra Space</span>
    </a>
    <nav aria-label="Main">
      <ul class="ts-nav">
        {%- for link in site.data.navigation.main -%}
          <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {%- endfor -%}
      </ul>
    </nav>
  </div>
</header>
